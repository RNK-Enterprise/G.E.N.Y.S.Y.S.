# GENYSYS™ — release
# Copyright © 2026 Asgard Innovations / RNK™. All Rights Reserved.
#
# On a v* tag push: build the real packages (deb / rpm / AppImage), run the
# packaging smoke suite (which itself re-runs the vite build through the
# global-wiring audit gate, cargo test, artifact integrity/freshness checks,
# and headless launch-verification), then create the GitHub release and attach
# the artifacts. A release only exists if its bundles survived the same gate
# the packages job runs on every push.
#
# Note: the release binary embeds the frontend at build time (distDir), so
# `generate software version` is left unset — the binary's embedded assets are
# the version of record, enforced by the smoke suite's freshness checks.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Same build + packaging toolchain as the package job (WebKitGTK 4.1,
      # soup2 for wry, deb/rpm/AppImage verification tools).
      - name: Install build + packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup2.4-dev patchelf dpkg-dev desktop-file-utils \
            file cpio rpm xvfb libegl1 libgl1 bubblewrap
          # GH runners ship kernel.apparmor_restrict_unprivileged_userns=1,
          # which blocks WebKitGTK's bubblewrap-spawned web process even with
          # the sandbox-off env vars set. Verification-only runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm ci

      # Builds deb + rpm + AppImage with the frontend embedded at build time
      # (beforeBuildCommand → npm run build:vite → audit gate first).
      - name: Build packages (deb / rpm / AppImage)
        run: bash scripts/build-appimage.sh /tmp/appimagetool.AppImage

      # Release gate: freshness (embedded binary == current build), deb
      # dependency sanity, .desktop validation, AppImage magic, headless
      # boot + fail-closed HOLD verification.
      - name: Run packaging smoke suite
        run: bash scripts/smoke-suite.sh --skip-build

      # The suite's own launch logs die with the job (mktemp dir); dump them
      # inline so a CI-only boot failure names itself instead of a bare FAIL.
      - name: Dump smoke-suite launch logs (on failure)
        if: failure()
        run: |
          for f in /tmp/genysys-smoke-*/appimage.log /tmp/genysys-smoke-*/bin.log /tmp/genysys-smoke-*/installed.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            tail -25 "$f"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent on tag re-push: if the release already exists (created
          # by a previous run of this tag), update its notes and replace the
          # assets instead of failing on the duplicate tag name.
          if gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists — updating assets"
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" --jq .body > /tmp/release-notes.md
            gh release edit "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
              --title "GENYSYS ${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md
            for f in src-tauri/target/release/bundle/deb/*.deb \
                     src-tauri/target/release/bundle/rpm/*.rpm \
                     src-tauri/target/release/bundle/appimage/*.AppImage; do
              gh release upload "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --clobber "$f"
            done
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "GENYSYS ${GITHUB_REF_NAME}" \
              --generate-notes \
              src-tauri/target/release/bundle/deb/*.deb \
              src-tauri/target/release/bundle/rpm/*.rpm \
              src-tauri/target/release/bundle/appimage/*.AppImage
          fi
