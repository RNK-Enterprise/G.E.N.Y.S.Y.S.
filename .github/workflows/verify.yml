# GENYSYS™ — verification gate
# Copyright © 2026 Asgard Innovations / RNK™. All Rights Reserved.
#
# Four jobs on every push (plus two native-engine jobs on manual dispatch):
#   1. verify — scripts/ci-verify.sh: global audit → jest → playwright →
#      cargo test (scripts/verify.sh --fail-fast), so an unwired global, a
#      broken page, or a failing Rust test can never land.
#   2. verify-live — scripts/verify-live.sh under Xvfb: builds the debug
#      binary and drives a real tab open/close in a compositor, asserting
#      the [genysys:tabwin] create → close → destroyed journal lines + OS-level
#      X-window teardown. A first-class job so branch protection can require
#      it independently (required checks attach per job, not per step).
#   3. native-cookie-proof — the real WebKitGTK cookie manager under Xvfb:
#      first-request delivery, HttpOnly, cross-site SameSite=None, and logout
#      through the real attestation_cookie_clear command. Also runs the
#      SameSite=Lax negative mode and the production-domain clear proof, then
#      verifies the feature-off binary contains no proof code.
#   4. package — builds the real .deb/.rpm/AppImage and runs the packaging
#      smoke suite (integrity, freshness, dependency sanity, headless
#      launch-verify), so CI proves the BUNDLES, not just the source tree.

name: verify

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Playwright's own apt helper installs the browser's OS libraries; the
      # GTK/WebKit dev packages come from scripts/ci-verify.sh.
      - run: npx playwright install --with-deps chromium

      - name: Run verification gate (audit → unit → e2e → cargo test)
        run: bash scripts/ci-verify.sh

      - name: Upload stage logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: |
            /tmp/genysys-verify/*.log
          if-no-files-found: ignore

  # The compositor-level proof as its own gate: builds the debug binary
  # (cache-warmed), launches GENYSYS under Xvfb, drives a real tab open/close
  # with xdotool, and asserts the [genysys:tabwin] create → close → destroyed
  # journal lines plus OS-level X-window teardown — the lifecycle the mock
  # runtime cannot observe. Runs on every push.
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Build deps (WebKitGTK 4.1 + GTK3) and the drive tooling: xvfb
      # (headless display), xdotool (window search/keystrokes), bubblewrap
      # (WebKitGTK's web-process sandbox; probed by the script's failure
      # dumps).
      - name: Install build + drive dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup2.4-dev patchelf xvfb xdotool bubblewrap
          # GH runners ship kernel.apparmor_restrict_unprivileged_userns=1,
          # which blocks WebKitGTK's bubblewrap-spawned web process even with
          # the sandbox-off env vars set (verified in CI: tab webview never
          # realizes). Verification-only runner; reverted to runner default
          # at job end.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm ci

      # generate_context! validates distDir (../dist) at COMPILE time — a
      # fresh clone has no dist/ and the proc macro panics minutes into the
      # cargo build (see scripts/ci-verify.sh).
      - name: Build frontend (dist/ for Tauri's compile-time distDir check)
        run: npm run build:vite

      - name: Build debug binary (WebKitGTK pkg-config wrapper)
        run: cd src-tauri && bash ../scripts/with-webkit-pc.sh cargo build

      - name: Live tab-window proof (headless, Xvfb)
        run: bash scripts/verify-live.sh --xvfb

      # verify-live.sh keeps its scratch dir (app log) on failure and prints
      # the path; capture it as an artifact so the journal evidence survives
      # the job.
      - name: Upload live-proof logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-live-logs
          path: |
            /tmp/genysys-live.*/app.log
            /tmp/genysys-live.*/vite.log
          if-no-files-found: ignore

  # Real WebKitGTK cookie proof. The hidden proof window starts on a plain
  # HTTP boot page, switches the proof-only web context to ignore the
  # temporary certificate, then exercises the HTTPS probe. Production builds
  # do not enable the feature and keep normal certificate enforcement.
  native-cookie-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install build + display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup2.4-dev patchelf xvfb bubblewrap \
            libegl1 libgl1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm ci

      - name: Run native-cookie proof under Xvfb
        run: |
          set -o pipefail
          xvfb-run -a npm run proof:native-cookie 2>&1 | tee /tmp/genysys-native-cookie-proof.log

      - name: Run negative SameSite=Lax proof under Xvfb
        run: |
          set -o pipefail
          xvfb-run -a npm run proof:native-cookie -- --negative 2>&1 | tee /tmp/genysys-native-cookie-proof-negative.log

      - name: Run production-domain clear proof (Linux WebKitGTK)
        run: |
          set -o pipefail
          xvfb-run -a npm run proof:native-cookie -- --domain 2>&1 | tee /tmp/genysys-native-cookie-production-domain.log

      - name: Verify production binary excludes proof code
        run: bash scripts/verify-production-cookie-exclusion.sh

      - name: Upload proof logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-cookie-proof-logs
          path: |
            /tmp/genysys-native-cookie-proof.log
            /tmp/genysys-native-cookie-proof-negative.log
            /tmp/genysys-native-cookie-production-domain.log
          if-no-files-found: warn

  # Native engine runs for the two host-specific targets Linux cannot prove.
  # They are manual-only so ordinary Linux pushes do not pay for two GUI
  # builders; dispatch this workflow on the PR branch to run them.
  native-cookie-proof-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # The repository name ends in a dot, which Windows normalizes out of the
      # runner workspace path. A shallow clone under RUNNER_TEMP avoids the
      # uncreatable default checkout directory entirely.
      - name: Checkout into a Windows-safe path
        shell: bash
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            https://github.com/RNK-Enterprise/G.E.N.Y.S.Y.S..git \
            "$RUNNER_TEMP/genysys"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/genysys/src-tauri

      - name: Install dependencies
        shell: bash
        working-directory: ${{ runner.temp }}/genysys
        run: npm ci --no-audit --no-fund

      - name: Run positive WebView2 proof
        shell: bash
        working-directory: ${{ runner.temp }}/genysys
        run: |
          set -o pipefail
          npm run proof:native-cookie 2>&1 | tee "$RUNNER_TEMP/native-cookie-windows-positive.log"

      - name: Run negative WebView2 proof
        shell: bash
        working-directory: ${{ runner.temp }}/genysys
        run: |
          set -o pipefail
          npm run proof:native-cookie -- --negative 2>&1 | tee "$RUNNER_TEMP/native-cookie-windows-negative.log"

      - name: Upload Windows proof logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-cookie-windows-logs
          path: ${{ runner.temp }}/native-cookie-windows-*.log
          if-no-files-found: warn

  native-cookie-proof-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --no-audit --no-fund

      - name: Run positive WKWebView proof
        run: |
          set -o pipefail
          npm run proof:native-cookie 2>&1 | tee "$RUNNER_TEMP/native-cookie-macos-positive.log"

      - name: Run negative WKWebView proof
        run: |
          set -o pipefail
          npm run proof:native-cookie -- --negative 2>&1 | tee "$RUNNER_TEMP/native-cookie-macos-negative.log"

      - name: Upload macOS proof logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-cookie-macos-logs
          path: ${{ runner.temp }}/native-cookie-macos-*.log
          if-no-files-found: warn

  package:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Build deps (WebKitGTK 4.1 + GTK3) and packaging/verification tooling:
      # dpkg-dev (dpkg-deb), desktop-file-utils (.desktop validation),
      # file (ELF magic), cpio/rpm (rpm payload checks), xvfb (launch-verify).
      - name: Install build + packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup2.4-dev patchelf dpkg-dev desktop-file-utils \
            file cpio rpm xvfb xdotool libegl1 libgl1 bubblewrap
          # GH runners ship kernel.apparmor_restrict_unprivileged_userns=1,
          # which blocks WebKitGTK's bubblewrap-spawned web process even with
          # the sandbox-off env vars set (verified in CI: tab webview never
          # realizes). Verification-only runner; reverted to runner default
          # at job end.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm ci

      # Builds deb + rpm + AppImage (fetches appimagetool; FUSE-free via
      # APPIMAGE_EXTRACT_AND_RUN inside the script).
      - name: Build packages (deb / rpm / AppImage)
        run: bash scripts/build-appimage.sh /tmp/appimagetool.AppImage

      # Same gate the release process runs: artifact integrity, freshness
      # (embedded binary == current build), dep sanity, headless launch.
      - name: Run packaging smoke suite
        run: bash scripts/smoke-suite.sh --skip-build

      # The suite's own launch logs die with the job (mktemp dir); dump them
      # inline so a CI-only boot failure names itself instead of a bare FAIL.
      - name: Dump smoke-suite launch logs (on failure)
        if: failure()
        run: |
          for f in /tmp/genysys-smoke-*/appimage.log /tmp/genysys-smoke-*/bin.log /tmp/genysys-smoke-*/installed.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            tail -25 "$f"
          done

      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: genysys-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
