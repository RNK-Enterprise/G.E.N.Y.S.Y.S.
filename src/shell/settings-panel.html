    <!-- Settings Panel -->
    <div id="settings-panel" class="settings-panel hidden">
        <div class="settings-content">
            <div class="settings-header">
                <h2>Settings</h2>
                <button id="settings-dense-toggle" class="close-btn settings-dense-toggle" type="button" title="Dense Settings">Dense</button>
                <button id="close-settings" class="close-btn">&times;</button>
            </div>

            <div class="settings-body">
                <div class="settings-nav">
                    <button class="settings-tab active" data-tab="general">General</button>
                    <button class="settings-tab" data-tab="appearance">Appearance</button>
                    <button class="settings-tab" data-tab="privacy">Privacy</button>
                    <button class="settings-tab" data-tab="performance">Performance</button>
                    <button class="settings-tab" data-tab="genysys">G.E.N.E.S.Y.S.</button>
                    <button class="settings-tab" data-tab="advanced">Advanced</button>
                </div>

                <div class="settings-sections">
                    <!-- General Settings -->
                    <div id="settings-section-general" class="settings-section active" data-section="general">
                        <h3 class="settings-section-heading">General Settings <button id="settings-general-toggle" class="genysys-sidebar-mini-action" type="button">Collapse</button></h3>
                        <div class="setting-item">
                            <label>Homepage</label>
                            <input type="text" id="setting-homepage" placeholder="https://www.google.com">
                        </div>
                        <div class="setting-item">
                            <label>Search Engine</label>
                            <select id="setting-search-engine">
                                <option value="google">Google</option>
                                <option value="duckduckgo">DuckDuckGo</option>
                                <option value="bing">Bing</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label>New Tab Behavior</label>
                            <select id="setting-new-tab">
                                <option value="homepage">Homepage</option>
                                <option value="blank">Blank Page</option>
                                <option value="bookmarks">Bookmarks</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label>
                                <input type="checkbox" id="setting-show-bookmarks-bar">
                                Show Bookmarks Bar
                            </label>
                        </div>
                    </div>

                    <!-- Appearance Settings -->
                    <div id="settings-section-appearance" class="settings-section" data-section="appearance">
                        <h3 class="settings-section-heading">Appearance <button id="settings-appearance-toggle" class="genysys-sidebar-mini-action" type="button">Collapse</button></h3>
                        <div class="setting-item">
                            <label>Theme</label>
                            <select id="setting-theme">
                                <option value="dark-neutral">Dark Neutral (Default)</option>
                                <option value="dark">Dark</option>
                                <option value="light">Light</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label>Font Size</label>
                            <select id="setting-font-size">
                                <option value="small">Small</option>
                                <option value="medium">Medium</option>
                                <option value="large">Large</option>
                            </select>
                        </div>
                        <div id="settings-density-matrix"></div>
                        <div class="setting-item">
                            <label>
                                <input type="checkbox" id="setting-show-status-bar">
                                Show Status Bar
                            </label>
                        </div>
                        <div class="setting-item">
                            <label>
                                <input type="checkbox" id="setting-enable-animations">
                                Enable Animations
                            </label>
                        </div>
                    </div>

                    <!-- Privacy Settings -->
                    <div id="settings-section-privacy" class="settings-section" data-section="privacy">
                        <h3 class="settings-section-heading">Privacy & Security <button id="settings-privacy-toggle" class="genysys-sidebar-mini-action" type="button">Collapse</button></h3>
                        <div class="setting-item">
                            <label>
                                <input type="checkbox" id="setting-block-cookies">
                                Block Third-Party Cookies
                            </label>
                        </div>
                        <div class="setting-item">
                            <label>
                                <input type="checkbox" id="setting-enable-dnt">
                                Enable Do Not Track
                            </label>
                        </div>
                        <div class="setting-item">
                            <label>
                                <input type="checkbox" id="setting-clear-history">
                                Clear History on Exit
                            </label>
                        </div>
                        <div class="setting-item">
                            <button id="clear-history-btn" class="action-btn">Clear Browsing History</button>
                        </div>
                    </div>

                    <!-- Performance Settings -->
                    <div id="settings-section-performance" class="settings-section" data-section="performance">
                        <h3 class="settings-section-heading">Performance <button id="settings-performance-toggle" class="genysys-sidebar-mini-action" type="button">Collapse</button></h3>
                        <div class="setting-item">
                            <label>
                                <input type="checkbox" id="setting-hardware-accel">
                                Enable Hardware Acceleration
                            </label>
                        </div>
                        <div class="setting-item">
                            <label>
                                <input type="checkbox" id="setting-genysys-engines">
                                Enable G.E.N.E.S.Y.S. Engines
                            </label>
                        </div>
                        <div class="setting-item">
                            <label>
                                <input type="checkbox" id="setting-preload-pages">
                                Preload Pages for Faster Browsing
                            </label>
                        </div>
                        <div class="setting-item">
                            <label>Max Cache Size (MB)</label>
                            <input type="number" id="setting-cache-size" min="100" max="5000" step="100">
                        </div>
                    </div>

                    <!-- G.E.N.E.S.Y.S. Capabilities -->
                    <div id="settings-section-genysys" class="settings-section" data-section="genysys">
                        <h3 class="settings-section-heading">G.E.N.E.S.Y.S. Capabilities <button id="settings-genysys-toggle" class="genysys-sidebar-mini-action" type="button">Collapse</button></h3>
                        <div class="setting-item">
                            <label>Loaded Manifest</label>
                            <div id="genysys-manifest-summary" class="genysys-summary">Loading G.E.N.E.S.Y.S. manifest...</div>
                        </div>
                        <div class="setting-item">
                            <label>Capability Categories</label>
                            <div id="genysys-category-list" class="genysys-chip-list"></div>
                        </div>
                        <div class="setting-item">
                            <label>Available Surfaces</label>
                            <div id="genysys-surface-list" class="genysys-chip-list"></div>
                        </div>
                        <div class="setting-item">
                            <label>Enabled Capabilities</label>
                            <div id="genysys-capability-list" class="genysys-capability-list"></div>
                        </div>
                    </div>

                    <!-- Advanced Settings -->
                    <div id="settings-section-advanced" class="settings-section" data-section="advanced">
                        <h3 class="settings-section-heading">Advanced Settings <button id="settings-advanced-toggle" class="genysys-sidebar-mini-action" type="button">Collapse</button></h3>
                        <div class="setting-item">
                            <label>
                                <input type="checkbox" id="setting-dev-tools">
                                Enable Developer Tools
                            </label>
                        </div>
                        <div class="setting-item">
                            <label>
                                <input type="checkbox" id="setting-experimental">
                                Enable Experimental Features
                            </label>
                        </div>
                        <div class="setting-item">
                            <label>Custom User Agent (optional)</label>
                            <input type="text" id="setting-user-agent" placeholder="Leave blank for default">
                        </div>
                        <div class="setting-item">
                            <button id="reset-settings-btn" class="action-btn danger">Reset to Defaults</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
