<!doctype html>
<!--
  G.E.N.E.S.Y.S. — Internal tab page (app-origin)
  Copyright © 2026 Asgard Innovations / RNK™. All Rights Reserved.

  Served from the app origin (tauri://localhost in release) so the tab-window
  navigation guard can allow it by exact origin match. Views:
    (no query)          New Tab
    ?view=block&reason=&domain=   P.R.O.T.E.C.T.S. block page
    ?view=quarantine&reason=&domain=  Quarantine notice
    ?view=access-request&domain=    Access request form (posts to shell)
    ?view=locked            Session locked (fail-closed state)
  This page never loads remote resources and never touches the network.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>G.E.N.E.S.Y.S.</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a1120; color: #e6ecf7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }
    .container { max-width: 540px; width: 100%; text-align: center; }
    .shield {
      width: 76px; height: 76px; margin: 0 auto 1.5rem;
      background: #16223a; border: 2px solid #233350; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 2.1rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .6rem; }
    p  { font-size: .875rem; color: #94a3b8; line-height: 1.65; margin-bottom: 1.25rem; }
    .domain {
      font-size: .85rem; color: #cbd5e1; background: #0a1120;
      border: 1px solid #233350; border-radius: .375rem;
      padding: .45rem .75rem; margin: 0 auto 1.25rem; display: inline-block;
      word-break: break-all; max-width: 100%;
    }
    .reason {
      font-size: .75rem; color: #64748b; background: #0a1120;
      border: 1px solid #233350; border-radius: .375rem;
      padding: .55rem .75rem; margin-bottom: 1.5rem; text-align: left;
    }
    .reason span { font-weight: 600; }
    .clock { font-size: 2.6rem; font-weight: 200; letter-spacing: .05em; margin-bottom: .75rem; }
    button {
      background: #233350; border: 1px solid #334155; color: #94a3b8;
      padding: .5rem 1.25rem; border-radius: .375rem; cursor: pointer;
      font-size: .875rem; transition: all .15s; margin: 0 .3rem;
    }
    button:hover { background: #334155; color: #e2e8f0; }
    .danger h1 { color: #ef4444; } .danger .shield { border-color: #7f1d1d; }
    .warn h1 { color: #f59e0b; } .warn .shield { border-color: #78350f; }
    .info h1 { color: #60a5fa; } .info .shield { border-color: #1d4ed8; }
    .locked h1 { color: #ef4444; } .locked .shield { border-color: #7f1d1d; }
    label { display: block; font-size: .8rem; color: #94a3b8; margin: 0 0 .4rem; text-align: left; }
    textarea {
      width: 100%; background: #0a1120; border: 1px solid #233350; border-radius: .375rem;
      color: #e2e8f0; padding: .6rem .75rem; font-size: .875rem; resize: vertical;
      min-height: 84px; font-family: inherit;
    }
    textarea:focus { outline: none; border-color: #3b82f6; }
    .success { color: #34d399; margin-top: 1rem; font-size: .875rem; display: none; }
    .foot { margin-top: 2rem; font-size: .7rem; color: #475569; }
  </style>
</head>
<body>
  <div class="container">
    <div class="shield" id="icon">RNK</div>
    <h1 id="title">G.E.N.E.S.Y.S.</h1>
    <div class="domain" id="domain" hidden></div>
    <p id="body-text">New tab</p>
    <div class="reason" id="reason" hidden><span>Reason:</span> <code id="reason-code"></code></div>
    <div id="form-wrap" hidden>
      <label for="reason-input">Reason for access (required)</label>
      <textarea id="reason-input" placeholder="Briefly explain why you need access to this site..."></textarea>
      <div class="success" id="result">✓ Request submitted. You will be notified when approved.</div>
    </div>
    <div id="actions"></div>
    <div class="clock" id="clock" hidden></div>
    <div class="foot">G.E.N.E.S.Y.S. — RNK's only client · P.R.O.T.E.C.T.S.-governed (fail-closed)</div>
  </div>

  <script>
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
    }
    var params = new URLSearchParams(window.location.search);
    var view = params.get('view') || 'newtab';
    var domain = params.get('domain') || '';
    var reason = params.get('reason') || '';
    var actions = document.getElementById('actions');

    function button(label, onClick, cls) {
      var b = document.createElement('button');
      b.textContent = label;
      if (cls) b.className = cls;
      b.addEventListener('click', onClick);
      actions.appendChild(b);
      return b;
    }

    function backButton() { button('Go Back', function () { history.back(); }); }

    if (view === 'block') {
      document.title = 'G.E.N.E.S.Y.S. — Blocked';
      document.getElementById('icon').textContent = 'RNK';
      document.querySelector('.container').classList.add('danger');
      document.getElementById('title').textContent = 'Blocked by P.R.O.T.E.C.T.S.';
      document.getElementById('domain').hidden = false;
      document.getElementById('domain').textContent = domain || 'unknown destination';
      document.getElementById('body-text').textContent =
        'This destination was refused by policy. Nothing was loaded.';
      document.getElementById('reason').hidden = false;
      document.getElementById('reason-code').textContent = reason || 'policy_violation';
      backButton();
    } else if (view === 'quarantine') {
      document.title = 'G.E.N.E.S.Y.S. — Quarantined';
      document.querySelector('.container').classList.add('warn');
      document.getElementById('title').textContent = 'Suspicious destination quarantined';
      document.getElementById('domain').hidden = false;
      document.getElementById('domain').textContent = domain || 'unknown destination';
      document.getElementById('reason').hidden = false;
      document.getElementById('reason-code').textContent = reason || 'quarantine';
      backButton();
    } else if (view === 'access-request') {
      document.title = 'G.E.N.E.S.Y.S. — Access Request';
      document.querySelector('.container').classList.add('info');
      document.getElementById('title').textContent = 'Access Request Required';
      document.getElementById('domain').hidden = false;
      document.getElementById('domain').textContent = domain || 'this site';
      document.getElementById('body-text').textContent =
        'This site is not on your authorized list. Submit a request — your management chain will be notified for approval.';
      document.getElementById('form-wrap').hidden = false;
      button('Cancel', function () { history.back(); });
      button('Submit Request', function () {
        var input = document.getElementById('reason-input');
        var value = input.value.trim();
        if (!value) { input.focus(); return; }
        try {
          if (window.__TAURI__ && window.__TAURI__.invoke) {
            window.__TAURI__.invoke('request_site_access', { domain: domain, reason: value });
          } else {
            window.parent.postMessage({ type: 'genysys:access-request', domain: domain, reason: value }, '*');
          }
        } catch (e) { /* best-effort */ }
        document.getElementById('result').style.display = 'block';
        document.getElementById('actions').style.display = 'none';
      }, 'submit');
    } else if (view === 'locked') {
      document.title = 'G.E.N.E.S.Y.S. — Locked';
      document.querySelector('.container').classList.add('locked');
      document.getElementById('icon').textContent = 'LOCK';
      document.getElementById('title').textContent = 'Session locked';
      document.getElementById('body-text').textContent =
        'The C.O.M.M.A.N.D. / Resolute session ended or the heartbeat dropped. ' +
        'P.R.O.T.E.C.T.S. locked every tab (fail-closed). Return to the main window and re-arm the gate to resume browsing.';
    } else {
      // New tab: clock + honest note. No web search widget pretending to phone home.
      document.getElementById('clock').hidden = false;
      function tick() {
        var d = new Date();
        document.getElementById('clock').textContent =
          d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      tick();
      setInterval(tick, 15000);
      document.getElementById('body-text').textContent = 'G.E.N.E.S.Y.S. — RNK\'s only client. Enter an address in the omnibox.';
      var note = document.createElement('p');
      note.style.fontSize = '.78rem';
      note.textContent = 'Navigation is gated by P.R.O.T.E.C.T.S. RNK product surfaces open as privileged tabs.';
      actions.appendChild(note);
    }
  </script>
</body>
</html>
