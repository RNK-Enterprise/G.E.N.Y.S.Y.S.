[package]
name = "rnk-genysys"
version = "0.1.0"
description = "G.E.N.Y.S.Y.S. — RNK browser. COMMAND-gated sessions. P.R.O.T.E.C.T.S. policy fail-closed."
authors = ["Asgard Innovations / RNK™"]
license = "PROPRIETARY"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "window-unminimize", "window-close", "window-hide", "window-unmaximize", "window-minimize", "http-all", "window-show", "window-maximize", "window-start-dragging", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
rusqlite = { version = "0.30", features = ["bundled"] }
url = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "0.18"
soup2 = { version = "0.2", features = ["v2_70"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.19.1"
windows = { version = "0.39", features = ["Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.24"
block = "0.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Feature-gated local WebView2/WKWebView cookie proof. Not part of production.
native-cookie-live-proof = []

[dev-dependencies]
# Unlocks tauri::test (mock runtime) for headless window-lifecycle tests.
tauri = { version = "1.5", features = ["test"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[patch.crates-io]
wry = { path = "../vendor/wry" }
